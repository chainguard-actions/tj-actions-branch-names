name: CI

permissions:
  contents: read

on:
  push:
    tags:
      - '*'
    branches:
      - main
  release:
    types: [published, created]
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test branch-names
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"
      - name: Run test
        id: branch-names
        uses: ./
      - name: Show output
        env:
          DEFAULT_BRANCH: ${{ steps.branch-names.outputs.default_branch }}
          CURRENT_BRANCH: ${{ steps.branch-names.outputs.current_branch }}
          BASE_REF: ${{ steps.branch-names.outputs.base_ref_branch }}
          HEAD_REF: ${{ steps.branch-names.outputs.head_ref_branch }}
          REF: ${{ steps.branch-names.outputs.ref_branch }}
          IS_DEFAULT: ${{ steps.branch-names.outputs.is_default }}
          IS_TAG: ${{ steps.branch-names.outputs.is_tag }}
          TAG: ${{ steps.branch-names.outputs.tag }}
        run: |
          echo "Default Branch: $DEFAULT_BRANCH"
          echo "Current Branch: $CURRENT_BRANCH"
          echo "Base Ref: $BASE_REF"
          echo "Head Ref: $HEAD_REF"
          echo "Ref: $REF"
          echo "Is Default: $IS_DEFAULT"
          echo "Is Tag: $IS_TAG"
          echo "Current tag: $TAG"
      - name: Test is_default output for pull request
        if: contains(github.event_name, 'pull_request') && steps.branch-names.outputs.is_tag == 'false' && steps.branch-names.outputs.is_default != 'false'
        env:
          IS_DEFAULT: ${{ steps.branch-names.outputs.is_default }}
        run: |
          echo "Is default is invalid: $IS_DEFAULT"
          exit 1
      - name: Test is_default output for non pull request
        if: "!contains(github.event_name, 'pull_request') && steps.branch-names.outputs.is_tag == 'false' && steps.branch-names.outputs.is_default != 'true'"
        env:
          IS_DEFAULT: ${{ steps.branch-names.outputs.is_default }}
        run: |
          echo "Is default is invalid: $IS_DEFAULT"
          exit 1
      - name: Test base_ref_branch output
        if: contains(github.event_name, 'pull_request') && steps.branch-names.outputs.is_tag == 'false' && !steps.branch-names.outputs.base_ref_branch
        env:
          BASE_REF_BRANCH: ${{ steps.branch-names.outputs.base_ref_branch }}
        run: |
          echo "Base ref unset: $BASE_REF_BRANCH"
          exit 1
      - name: Test head_ref output
        if: contains(github.event_name, 'pull_request') && steps.branch-names.outputs.is_tag == 'false' && !steps.branch-names.outputs.head_ref_branch
        env:
          HEAD_REF_BRANCH: ${{ steps.branch-names.outputs.head_ref_branch }}
        run: |
          echo "Head ref unset: $HEAD_REF_BRANCH"
          exit 1
      - name: Test ref_branch output
        if: "!steps.branch-names.outputs.ref_branch && steps.branch-names.outputs.is_tag == 'false'"
        env:
          REF_BRANCH: ${{ steps.branch-names.outputs.ref_branch }}
        run: |
          echo "Ref unset: $REF_BRANCH"
          exit 1
      - name: Test current_branch output for pull_request or pull_request_target event.
        if: contains(github.event_name, 'pull_request') && steps.branch-names.outputs.is_tag == 'false' && !steps.branch-names.outputs.current_branch
        env:
          CURRENT_BRANCH: ${{ steps.branch-names.outputs.current_branch }}
        run: |
          echo "Current branch unset: $CURRENT_BRANCH"
          exit 1
      - name: Test current_branch output for push event.
        if: github.event_name == 'push' && steps.branch-names.outputs.is_tag == 'false' && !steps.branch-names.outputs.current_branch
        env:
          CURRENT_BRANCH: ${{ steps.branch-names.outputs.current_branch }}
        run: |
          echo "Current branch unset: $CURRENT_BRANCH"
          exit 1
      - name: Test current_branch output for tag based push event.
        if: github.event_name == 'push' && steps.branch-names.outputs.is_tag == 'true' && !steps.branch-names.outputs.base_ref_branch
        env:
          BASE_REF_BRANCH: ${{ steps.branch-names.outputs.base_ref_branch }}
        run: |
          echo "Base ref unset: $BASE_REF_BRANCH"
          exit 1
      - name: Test tag output for tag based push event.
        if: github.event_name == 'push' && steps.branch-names.outputs.is_tag == 'true' && !steps.branch-names.outputs.tag
        env:
          TAG: ${{ steps.branch-names.outputs.tag }}
        run: |
          echo "Current tag unset: $TAG"
          exit 1
      - name: Run test strip_branch_prefix
        id: branch-names-strip_branch_prefix
        uses: ./
        with:
          strip_branch_prefix: 'chore/'
      - name: Show output
        env:
          DEFAULT_BRANCH: ${{ steps.branch-names-strip_branch_prefix.outputs.default_branch }}
          CURRENT_BRANCH: ${{ steps.branch-names-strip_branch_prefix.outputs.current_branch }}
          BASE_REF: ${{ steps.branch-names-strip_branch_prefix.outputs.base_ref_branch }}
          HEAD_REF: ${{ steps.branch-names-strip_branch_prefix.outputs.head_ref_branch }}
          REF: ${{ steps.branch-names-strip_branch_prefix.outputs.ref_branch }}
          IS_DEFAULT: ${{ steps.branch-names-strip_branch_prefix.outputs.is_default }}
          IS_TAG: ${{ steps.branch-names-strip_branch_prefix.outputs.is_tag }}
          TAG: ${{ steps.branch-names-strip_branch_prefix.outputs.tag }}
        run: |
          echo "Default Branch: $DEFAULT_BRANCH"
          echo "Current Branch: $CURRENT_BRANCH"
          echo "Base Ref: $BASE_REF"
          echo "Head Ref: $HEAD_REF"
          echo "Ref: $REF"
          echo "Is Default: $IS_DEFAULT"
          echo "Is Tag: $IS_TAG"
          echo "Current tag: $TAG"

      - name: Run test replace_slashes_with_hyphens
        id: branch-names-replace-slashes
        uses: ./
        with:
          replace_slashes_with_hyphens: 'true'
      - name: Show output with replaced slashes
        env:
          DEFAULT_BRANCH: ${{ steps.branch-names-replace-slashes.outputs.default_branch }}
          CURRENT_BRANCH: ${{ steps.branch-names-replace-slashes.outputs.current_branch }}
          BASE_REF: ${{ steps.branch-names-replace-slashes.outputs.base_ref_branch }}
          HEAD_REF: ${{ steps.branch-names-replace-slashes.outputs.head_ref_branch }}
          REF: ${{ steps.branch-names-replace-slashes.outputs.ref_branch }}
          IS_DEFAULT: ${{ steps.branch-names-replace-slashes.outputs.is_default }}
          IS_TAG: ${{ steps.branch-names-replace-slashes.outputs.is_tag }}
          TAG: ${{ steps.branch-names-replace-slashes.outputs.tag }}
        run: |
          echo "Default Branch: $DEFAULT_BRANCH"
          echo "Current Branch: $CURRENT_BRANCH"
          echo "Base Ref: $BASE_REF"
          echo "Head Ref: $HEAD_REF"
          echo "Ref: $REF"
          echo "Is Default: $IS_DEFAULT"
          echo "Is Tag: $IS_TAG"
          echo "Current tag: $TAG"
      - name: Test slash replacement in branch names
        if: contains(github.event_name, 'pull_request')
        shell: bash
        env:
          HEAD_REF_BRANCH: ${{ steps.branch-names-replace-slashes.outputs.head_ref_branch }}
          CURRENT_BRANCH: ${{ steps.branch-names-replace-slashes.outputs.current_branch }}
        run: |
          head_ref="$HEAD_REF_BRANCH"
          if [[ "$head_ref" == *"/"* ]]; then
            echo "Slash found in head_ref_branch after replacement: $head_ref"
            exit 1
          fi
          current_branch="$CURRENT_BRANCH"
          if [[ "$current_branch" == *"/"* ]]; then
            echo "Slash found in current_branch after replacement: $current_branch"
            exit 1
          fi
