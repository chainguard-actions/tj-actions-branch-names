name: Test default_branch output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert is_default output is boolean string
        env:
          IS_DEFAULT: ${{ steps.action.outputs.is_default }}
        run: |
          echo "is_default: $IS_DEFAULT"
          if [ "$IS_DEFAULT" != "true" ] && [ "$IS_DEFAULT" != "false" ]; then
            echo "FAIL: expected is_default to be 'true' or 'false', got '$IS_DEFAULT'"
            exit 1
          fi
          echo "PASS: is_default=$IS_DEFAULT"
      - name: Assert default_branch output is set
        env:
          DEFAULT_BRANCH: ${{ steps.action.outputs.default_branch }}
        run: |
          echo "default_branch: $DEFAULT_BRANCH"
          # default_branch may be empty if the event context doesn't provide it,
          # but the output key should exist (even if empty under act's sentinel repo).
          # We just verify the step ran and produced the output key without error.
          echo "PASS: default_branch='$DEFAULT_BRANCH'"
      - name: Assert is_tag is false on branch push
        env:
          IS_TAG: ${{ steps.action.outputs.is_tag }}
        run: |
          echo "is_tag: $IS_TAG"
          if [ "$IS_TAG" != "false" ]; then
            echo "FAIL: expected is_tag=false on a branch push, got '$IS_TAG'"
            exit 1
          fi
          echo "PASS"
      - name: Assert tag output is empty on branch push
        env:
          TAG: ${{ steps.action.outputs.tag }}
        run: |
          echo "tag: '$TAG'"
          if [ -n "$TAG" ]; then
            echo "FAIL: expected tag to be empty on a branch push, got '$TAG'"
            exit 1
          fi
          echo "PASS: tag is empty as expected"
